name: Static Job - AWS CI/CD

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:


permissions:
  contents: read
  id-token: write

concurrency:
  group: static-job-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ========================================
  # 1. CONTINUOUS INTEGRATION
  # ========================================
  ci:
    name: Lint and Build React
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Build React application
      run: npm run build

  # ========================================
  # 2. DOCKER BUILD, SCAN AND PUSH ECR
  # ========================================
  build-and-push:
    name: Build, Scan and Push to ECR
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build frontend image
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build \
          -f Dockerfile \
          -t "$REGISTRY/static-job-frontend:$IMAGE_TAG" \
          .

    - name: Build API image
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build \
          -f Dockerfile.json-server \
          -t "$REGISTRY/static-job-api:$IMAGE_TAG" \
          .

    - name: Scan frontend with Trivy
      uses: aquasecurity/trivy-action@0.33.1
      with:
        image-ref: ${{ steps.login-ecr.outputs.registry }}/static-job-frontend:${{ github.sha }}
        format: table
        severity: CRITICAL,HIGH
        exit-code: '1'
        ignore-unfixed: true

    - name: Scan API with Trivy
      uses: aquasecurity/trivy-action@0.33.1
      with:
        image-ref: ${{ steps.login-ecr.outputs.registry }}/static-job-api:${{ github.sha }}
        format: table
        severity: CRITICAL,HIGH
        exit-code: '1'
        ignore-unfixed: true

    - name: Push frontend to ECR
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker push \
          "$REGISTRY/static-job-frontend:$IMAGE_TAG"

    - name: Push API to ECR
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker push \
          "$REGISTRY/static-job-api:$IMAGE_TAG"

  # ========================================
  # 3. DEPLOY TO EC2 WITH SSM
  # ========================================
  deploy-to-ec2:
    name: Deploy to EC2 via SSM
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Prepare SSM deployment
      env:
        INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        APP_DIR: ${{ vars.EC2_APP_DIR }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import re
        import shlex
        import subprocess

        for key in (
            "INSTANCE_ID",
            "APP_DIR",
            "AWS_REGION",
            "IMAGE_TAG",
        ):
            if not os.getenv(key):
                raise SystemExit(
                    f"Missing GitHub variable: {key}"
                )

        instance_id = os.environ["INSTANCE_ID"]
        app_dir = os.environ["APP_DIR"]
        region = os.environ["AWS_REGION"]
        image_tag = os.environ["IMAGE_TAG"]

        if not re.fullmatch(
            r"i-[0-9a-f]{8,17}", instance_id
        ):
            raise SystemExit("Invalid EC2 instance ID")

        if not os.path.isabs(app_dir):
            raise SystemExit("APP_DIR must be absolute")

        account_id = subprocess.check_output(
            [
                "aws", "sts", "get-caller-identity",
                "--query", "Account",
                "--output", "text",
            ],
            text=True,
        ).strip()

        registry = (
            f"{account_id}.dkr.ecr."
            f"{region}.amazonaws.com"
        )

        values = {
            "APP_DIR": app_dir,
            "AWS_REGION": region,
            "ECR_REGISTRY": registry,
            "IMAGE_TAG": image_tag,
        }

        exports = "\n".join(
            f"export {key}={shlex.quote(value)}"
            for key, value in values.items()
        )

        script = exports + r"""
        set -euo pipefail

        cd "$APP_DIR"

        test -f docker-compose.prod.yml

        command -v aws
        command -v docker
        command -v curl

        docker compose version

        aws ecr get-login-password \
          --region "$AWS_REGION" |
          docker login \
            --username AWS \
            --password-stdin "$ECR_REGISTRY"

        docker compose \
          -f docker-compose.prod.yml \
          config --quiet

        docker compose \
          -f docker-compose.prod.yml \
          pull

        docker compose \
          -f docker-compose.prod.yml \
          up -d --remove-orphans

        docker compose \
          -f docker-compose.prod.yml \
          ps

        echo "Checking frontend..."

        FRONTEND_OK=false

        for attempt in $(seq 1 12); do
          if curl -fsS \
            http://127.0.0.1/ \
            -o /dev/null; then
            FRONTEND_OK=true
            break
          fi
          sleep 5
        done

        if [ "$FRONTEND_OK" != "true" ]; then
          echo "Frontend HTTP check: FAILED"
          exit 1
        fi

        echo "Frontend HTTP check: SUCCESS"

        echo "Checking JSON Server..."

        API_OK=false

        for attempt in $(seq 1 12); do
          if curl -fsS \
            http://127.0.0.1:3004/articles \
            -o /dev/null; then
            API_OK=true
            break
          fi
          sleep 5
        done

        if [ "$API_OK" != "true" ]; then
          echo "API HTTP check: FAILED"
          exit 1
        fi

        echo "API HTTP check: SUCCESS"
        echo "DEPLOYMENT SUCCESSFUL"
        """

        # AWS-RunShellScript may use /bin/sh.
        # Explicitly run the script with Bash.
        command = "bash -c " + shlex.quote(script)

        payload = {
            "DocumentName": "AWS-RunShellScript",
            "InstanceIds": [instance_id],
            "TimeoutSeconds": 600,
            "Parameters": {
                "commands": [command]
            },
        }

        with open(
            "ssm-command.json", "w", encoding="utf-8"
        ) as file:
            json.dump(payload, file)
        PY

    - name: Send deployment command to EC2
      id: deploy
      run: |
        COMMAND_ID=$(aws ssm send-command \
          --cli-input-json file://ssm-command.json \
          --query "Command.CommandId" \
          --output text)

        echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
        echo "SSM Command ID: $COMMAND_ID"

    - name: Wait for SSM deployment
      env:
        INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
      run: |
        STATUS="Pending"

        for attempt in $(seq 1 120); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query Status \
            --output text 2>/dev/null) || STATUS="Pending"

          echo "Deployment status: $STATUS"

          case "$STATUS" in
            Success|Failed|Cancelled|TimedOut|Cancelling)
              break
              ;;
          esac

          sleep 5
        done

        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --query \
            '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
          --output json || true

        if [ "$STATUS" != "Success" ]; then
          echo "Deployment FAILED: $STATUS"
          exit 1
        fi

        echo "Deployment completed successfully"
