name: Static Job - AWS CI/CD

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:


permissions:
  contents: read
  id-token: write

concurrency:
  group: static-job-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint and Build React
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Run ESLint
      run: npm run lint
    - name: Build React application
      run: npm run build

  build-and-push:
    name: Build and Push to ECR (security scan pending)
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    - name: Build frontend image
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -f Dockerfile -t "$REGISTRY/static-job-frontend:$IMAGE_TAG" .
    - name: Build API image
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -f Dockerfile.json-server -t "$REGISTRY/static-job-api:$IMAGE_TAG" .

    # TEMPORARY: Trivy was failing during installation on GitHub Actions.
    # No vulnerability scans run until this section is restored and validated.
    # Do not treat these images as security-validated production releases.

    - name: Push frontend image to ECR
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: docker push "$REGISTRY/static-job-frontend:$IMAGE_TAG"
    - name: Push API image to ECR
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: docker push "$REGISTRY/static-job-api:$IMAGE_TAG"

  deploy-to-ec2:
    name: Deploy to EC2 via SSM (manual only)
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
    - name: Prepare SSM deployment command
      env:
        INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        APP_DIR: ${{ vars.EC2_APP_DIR }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import re
        import shlex
        import subprocess
        import textwrap

        for key in ('INSTANCE_ID', 'APP_DIR', 'AWS_REGION', 'IMAGE_TAG'):
            if not os.environ.get(key):
                raise SystemExit(f'Missing GitHub variable: {key}')

        instance_id = os.environ['INSTANCE_ID']
        if not re.fullmatch(r'i-[0-9a-f]{8,17}', instance_id):
            raise SystemExit('Invalid EC2 instance ID')

        app_dir = os.environ['APP_DIR']
        if not os.path.isabs(app_dir):
            raise SystemExit('EC2_APP_DIR must be an absolute path')

        region = os.environ['AWS_REGION']
        image_tag = os.environ['IMAGE_TAG']
        account_id = subprocess.check_output(
            ['aws', 'sts', 'get-caller-identity', '--query', 'Account', '--output', 'text'],
            text=True,
        ).strip()
        registry = f'{account_id}.dkr.ecr.{region}.amazonaws.com'

        variables = {
            'APP_DIR': app_dir,
            'AWS_REGION': region,
            'ECR_REGISTRY': registry,
            'IMAGE_TAG': image_tag,
        }
        exports = '\n'.join(
            f'export {name}={shlex.quote(value)}'
            for name, value in variables.items()
        )

        script = exports + '\n' + textwrap.dedent('''\
            set -euo pipefail
            cd "$APP_DIR"
            test -f docker-compose.prod.yml
            command -v aws
            command -v docker
            command -v curl
            docker compose version

            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            docker compose -f docker-compose.prod.yml config --quiet
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps

            echo 'Checking frontend on port 80...'
            FRONTEND_OK=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error http://127.0.0.1/ -o /dev/null; then
                FRONTEND_OK=true
                break
              fi
              sleep 5
            done
            if [ "$FRONTEND_OK" != true ]; then
              echo 'Frontend HTTP check: FAILED'
              exit 1
            fi

            echo 'Checking JSON Server on port 3004...'
            API_OK=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error http://127.0.0.1/api/articles -o /dev/null; then
                API_OK=true
                break
              fi
              sleep 5
            done
            if [ "$API_OK" != true ]; then
              echo 'API HTTP check: FAILED'
              exit 1
            fi

            echo 'Frontend and API checks: SUCCESS'
        ''')

        # SSM RunShellScript starts under /bin/sh; run this script with Bash.
        command = 'bash -c ' + shlex.quote(script)
        payload = {
            'DocumentName': 'AWS-RunShellScript',
            'InstanceIds': [instance_id],
            'TimeoutSeconds': 600,
            'Parameters': {'commands': [command]},
        }
        with open('ssm-command.json', 'w', encoding='utf-8') as out:
            json.dump(payload, out)
        PY

    - name: Send deployment command
      id: deploy
      run: |
        COMMAND_ID=$(aws ssm send-command \
          --cli-input-json file://ssm-command.json \
          --query 'Command.CommandId' --output text)
        echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
        echo "SSM Command ID: $COMMAND_ID"

    - name: Wait for deployment result
      env:
        INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
      run: |
        STATUS=Pending
        for attempt in $(seq 1 120); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query Status --output text 2>/dev/null) || STATUS=Pending
          echo "Deployment status: $STATUS"
          case "$STATUS" in
            Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
          esac
          sleep 5
        done

        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
          --output json || true

        if [ "$STATUS" != Success ]; then
          echo "EC2 deployment failed: $STATUS"
          exit 1
        fi
        echo 'EC2 deployment completed successfully'
