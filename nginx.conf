
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Application React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Métriques Nginx pour Prometheus Exporter
    location = /nginx_status {
        stub_status;
        access_log off;
    }
}
