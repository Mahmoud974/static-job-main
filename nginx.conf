
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API JSON Server
    location /api/ {
        proxy_pass http://json-server:3004/;
    }

    # Application React
    location / {
        try_files $uri $uri/ /index.html;
    }

   # Métriques Nginx
location = /nginx_status {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    deny all;
}
}

