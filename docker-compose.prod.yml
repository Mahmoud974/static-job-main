
services:
  frontend:
    image: ${ECR_REGISTRY}/static-job-frontend:${IMAGE_TAG}
    ports:
      - "80:80"
    depends_on:
      - json-server
    restart: unless-stopped

  json-server:
    image: ${ECR_REGISTRY}/static-job-api:${IMAGE_TAG}
    ports:
      - "127.0.0.1:3004:3004"
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command:
      - "--nginx.scrape-uri=http://frontend/nginx_status"
    depends_on:
      - frontend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - nginx-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
